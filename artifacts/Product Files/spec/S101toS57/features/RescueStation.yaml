feature: RescueStation
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Area RescueStation geometry is converted to Point (ConvertGeometry) before output.
  The DSL does not currently have a geometry-convert action — flagged as TODO for Area case.

uses:
  - featureName_to_OBJNAM_NOBJNM
  - status_to_STATUS_INFORM
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_PEREND
  - Pad_PERSTA
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM

cases:
  - when: {geometry: Area}
    create:
      - object: RSCSTA
        # TODO: ConvertGeometry to Point — refer to S-65 Annex C for clarification
        actions:
          - copy: {from: categoryOfRescueStation, to: CATRSC}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM

  - create:
      - object: RSCSTA
        actions:
          - copy: {from: categoryOfRescueStation, to: CATRSC}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM
