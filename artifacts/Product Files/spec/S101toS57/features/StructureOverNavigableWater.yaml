feature: StructureOverNavigableWater
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Always outputs BUISGL. HRBFAC is added when categoryOfStructure is 2 (terminal)
  or 5 (airport terminal). Boathouse (categoryOfStructure=1) appends "Boathouse" to INFORM.
  C_AGGR collection is required when PylonBridgeSupport children exist — not representable
  in the DSL; refer to S-65 Annex C.
  ClearancestoINFORM and categoryOfStructuretoCATHAF not yet representable; refer to S-65 Annex C.

uses:
  - radarConspicuoustoCONRAD
  - visualProminence_to_CONVIS
  - natureOfConstruction_to_NATCON_INFORM
  - featureName_to_OBJNAM_NOBJNM
  - status_to_STATUS_INFORM
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_PEREND
  - Pad_PERSTA
  - Pad_SORDAT
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - contactDetails_to_INFORM
  - serviceHours_to_INFORM_NINFOM
  - nonStandardWorkingDay_to_INFORM_NINFOM
  - nauticalInformation_to_INFORM_NINFOM

cases:
  - create:
      - object: BUISGL
        actions:
          - lookup:
              source: categoryOfStructure
              cases:
                "1":
                  actions:
                    - set: {attr: INFORM, value: "Boathouse", append: true, sep: "; "}
          - copy: {from: colour, to: COLOUR}
          - copy: {from: condition, to: CONDTN}
          - copy: {from: colourPattern, to: COLPAT}
          - apply: radarConspicuoustoCONRAD
          - apply: visualProminence_to_CONVIS
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - copy: {from: height, to: HEIGHT}
          - copy: {from: verticalLength, to: VERLEN}
          - apply: natureOfConstruction_to_NATCON_INFORM
          # TODO: ClearancestoINFORM — refer to S-65 Annex C
          # TODO: categoryOfStructuretoCATHAF (direct to BUISGL when no HRBFAC) — refer to S-65 Annex C
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: Pad_SORDAT
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM
      - object: HRBFAC
        condition: "categoryOfStructure == '2' or categoryOfStructure == '5'"
        actions:
          # TODO: categoryOfStructuretoCATHAF → CATHAF — refer to S-65 Annex C
          - copy: {from: condition, to: CONDTN}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: Pad_SORDAT
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM
      # TODO: C_AGGR collection when has_child RoofedStructureAggregation/PylonBridgeSupport — refer to S-65 Annex C
