feature: SignalStationTraffic
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Area geometry is converted to Point (CARIS ConvertGeometry). The COMCHA attribute is
  populated from a script (assign_COMCHA) and from ContactDetails.communicationChannel.
  ContactDetails.callSign and other fields go to INFORM (not COMCHA).

uses:
  - Pad_DATEND
  - Pad_DATSTA
  - featureName_to_OBJNAM_NOBJNM
  - Pad_PEREND
  - Pad_PERSTA
  - status_to_STATUS_INFORM
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - contactDetails_COMCHA_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM

cases:
  - when: "geometry == Area"
    create:
      - object: SISTAT
        actions:
          - convert_geometry: Point
          - copy: {from: categoryOfSignalStationTraffic, to: CATSIT}
          # TODO: assign_COMCHA script populates COMCHA from communicationChannel — refer to S-65 Annex C
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_COMCHA_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM

  - create:
      - object: SISTAT
        actions:
          - copy: {from: categoryOfSignalStationTraffic, to: CATSIT}
          # TODO: assign_COMCHA script populates COMCHA from communicationChannel — refer to S-65 Annex C
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_COMCHA_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM
