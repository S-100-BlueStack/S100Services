        # TODO: UpdateObject (not create) — refer to S-65 Annex C for clarification
        actions:
          - set: {attr: INFORM, value: "Automatic Identification System (AIS) aid to navigation", append: true, sep: "; "}
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

  # CardinalBuoy
  - when: {geometry_equals_feature: CardinalBuoy}
    create:
      - object: BOYCAR
        # TODO: UpdateObject (not create) — refer to S-65 Annex C for clarification
        actions:
          - set: {attr: INFORM, value: "Automatic Identification System (AIS) aid to navigation", append: true, sep: "; "}
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

  # InstallationBuoy
  - when: {geometry_equals_feature: InstallationBuoy}
    create:
      - object: BOYINB
        # TODO: UpdateObject (not create) — refer to S-65 Annex C for clarification
        actions:
