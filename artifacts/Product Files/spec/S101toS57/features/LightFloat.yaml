feature: LightFloat
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Two cases:
  1. LightFloat with topmark/topmarkDaymarkShape populated → LITFLT + TOPMAR.
     TOPMAR gets colour/shape from topmark sub-attributes, plus information/fileReference,
     plus date padding from the parent feature.
  2. All other LightFloat → LITFLT only.
  natureOfConstruction_to_NATCON_INFORM is applied to LITFLT in both cases.

uses:
  - radarConspicuoustoCONRAD
  - visualProminence_to_CONVIS
  - natureOfConstruction_to_NATCON_INFORM
  - featureName_to_OBJNAM_NOBJNM
  - status_to_STATUS_INFORM
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_PEREND
  - Pad_PERSTA
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM_PICREP

cases:
  - when: {has: 'topmark.topmarkDaymarkShape'}
    create:
      - object: LITFLT
        actions:
          - copy: {from: colour, to: COLOUR}
          - copy: {from: colourPattern, to: COLPAT}
          - apply: radarConspicuoustoCONRAD
          - apply: visualProminence_to_CONVIS
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - copy: {from: horizontalLength, to: HORLEN}
          - copy: {from: horizontalWidth, to: HORWID}
          - apply: natureOfConstruction_to_NATCON_INFORM
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: verticalLength, to: VERLEN}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

      - object: TOPMAR
        actions:
          - copy: {from: 'topmark.colour', to: COLOUR}
          - copy: {from: 'topmark.topmarkDaymarkShape', to: TOPSHP}
          - copy: {from: 'topmark.shapeInformation.text', to: INFORM}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: Pad_PEREND
          - apply: Pad_PERSTA

  - create:
      - object: LITFLT
        actions:
          - copy: {from: colour, to: COLOUR}
          - copy: {from: colourPattern, to: COLPAT}
          - apply: radarConspicuoustoCONRAD
          - apply: visualProminence_to_CONVIS
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - copy: {from: horizontalLength, to: HORLEN}
          - copy: {from: horizontalWidth, to: HORWID}
          - apply: natureOfConstruction_to_NATCON_INFORM
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: verticalLength, to: VERLEN}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP
