feature: RadioCallingInPoint
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Three dispatch cases:
  1. Point AND orientationValue[1] populated → two RDOCAL features (non-reciprocal orientations,
     DCEG 15.28.1). First uses orientationValue[0], second uses orientationValue[1].
  2. Point/Line/Area that touches/is-within/overlaps a VesselTrafficServiceArea → RDOCAL
     plus C_AGGR collection with ADMARE. CreateCollectionFeature is not expressible in current DSL.
  3. Default → RDOCAL.
  assign_COMCHA is an XML attribute script — flagged as TODO.
  ContactDetails communicationChannel is commented out in the XML for cases 1/2/3
  (communicationChannel → COMCHA suppressed); only callSign/frequency/instructions → INFORM.
  RadioCallingInPoint ORIENT uses orientationValue[0] (indexed), not orientationValue directly.

uses:
  - featureName_to_OBJNAM_NOBJNM
  - status_to_STATUS_INFORM
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_PEREND
  - Pad_PERSTA
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM
  - nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
  - serviceHours_all_dates_to_INFORM_NINFOM

cases:
  # Point with second orientation → two RDOCAL (non-reciprocal bearings)
  - when: {and: [{geometry: Point}, {has: 'orientationValue[1]'}]}
    create:
      - object: RDOCAL
        actions:
          # TODO: assign_COMCHA script — refer to S-65 Annex C for clarification
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: 'orientationValue[0]', to: ORIENT}
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: trafficFlow, to: TRAFIC}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_all_dates_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM
      - object: RDOCAL
        actions:
          # TODO: assign_COMCHA script — refer to S-65 Annex C for clarification
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: 'orientationValue[1]', to: ORIENT}
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: trafficFlow, to: TRAFIC}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_all_dates_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM

  # Within/touching/overlapping a VesselTrafficServiceArea → RDOCAL + C_AGGR
  # TODO: geometry_touches/within/overlaps filter not in current DSL predicate set
  - when: {touches_or_within_or_overlaps_feature: VesselTrafficServiceArea}
    create:
      - object: RDOCAL
        actions:
          # TODO: assign_COMCHA script — refer to S-65 Annex C for clarification
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: 'orientationValue[0]', to: ORIENT}
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: trafficFlow, to: TRAFIC}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_all_dates_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM
          # TODO: CreateCollectionFeature C_AGGR with ADMARE — refer to S-65 Annex C for clarification

  # Default
  - create:
      - object: RDOCAL
        actions:
          # TODO: assign_COMCHA script — refer to S-65 Annex C for clarification
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: 'orientationValue[0]', to: ORIENT}
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: trafficFlow, to: TRAFIC}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_all_dates_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM
