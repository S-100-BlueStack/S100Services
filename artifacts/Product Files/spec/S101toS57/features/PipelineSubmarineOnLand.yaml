feature: PipelineSubmarineOnLand
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Two cases:
  1. categoryOfPipelinePipe = 7 → PIPSOL with categoryOfPipelinePipe forced to 5
     (S-101 value 7 = intake/outfall, mapped to S-57 value 5).
  2. Default → PIPSOL with direct copy of categoryOfPipelinePipe.
  Multiplicity_to_INFORM is an XML rule — flagged as TODO.

uses:
  - featureName_to_OBJNAM_NOBJNM
  - product_to_PRODCT_INFORM
  - status_to_STATUS_INFORM
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_SORDAT
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM

cases:
  - when: {eq: [categoryOfPipelinePipe, "7"]}
    create:
      - object: PIPSOL
        actions:
          - set: {attr: categoryOfPipelinePipe, value: "5"}
          # TODO: Multiplicity_to_INFORM — refer to S-65 Annex C for clarification
          - copy: {from: buriedDepth, to: BURDEP}
          - copy: {from: condition, to: CONDTN}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - copy: {from: depthRangeMinimumValue, to: DRVAL1}
          - copy: {from: depthRangeMaximumValue, to: DRVAL2}
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: product_to_PRODCT_INFORM
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: Pad_SORDAT
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM

  - create:
      - object: PIPSOL
        actions:
          # TODO: Multiplicity_to_INFORM — refer to S-65 Annex C for clarification
          - copy: {from: buriedDepth, to: BURDEP}
          - copy: {from: categoryOfPipelinePipe, to: CATPIP}
          - copy: {from: condition, to: CONDTN}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - copy: {from: depthRangeMinimumValue, to: DRVAL1}
          - copy: {from: depthRangeMaximumValue, to: DRVAL2}
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: product_to_PRODCT_INFORM
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: Pad_SORDAT
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM
