feature: FloatingDock
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Three cases in order of priority:
  1. Area geometry WITH fixedDateRange dates → FLODOC + CTNARE (secondary).
     CTNARE is produced via fixeddates_to_INFORM (local rule). FLODOC has no Pad_DATEND/DATSTA
     on the feature itself for this case — dates only come from ServiceHours related feature.
  2. Area geometry (no fixedDateRange dates) → FLODOC only (SoE); no CTNARE.
  3. All other geometry → FLODOC with Pad_DATEND/Pad_DATSTA on the feature itself.
  FLODOC is a Skin of the Earth feature in S-57; an intervention message is emitted for
  area cases to prompt adjustment of surrounding depth/dredged areas.
  maximumPermittedDraught_to_INFORM is a local rule that appends draught info to INFORM.

uses:
  - radarConspicuoustoCONRAD
  - visualProminence_to_CONVIS
  - natureOfConstruction_to_NATCON_INFORM
  - featureName_to_OBJNAM_NOBJNM
  - status_to_STATUS_INFORM
  - Pad_DATEND
  - Pad_DATSTA
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM_PICREP
  - nonStandardWorkingDay_dated_to_INFORM_NINFOM
  - nonStandardWorkingDay_to_INFORM_NINFOM
  - serviceHours_dated_to_INFORM_NINFOM
  - serviceHours_to_INFORM_NINFOM

cases:
  - when:
      and:
        - {geometry: Area}
        - {or: [{has: 'fixedDateRange.dateEnd'}, {has: 'fixedDateRange.dateStart'}]}
    create:
      - object: FLODOC
        actions:
          - copy: {from: colour, to: COLOUR}
          - copy: {from: colourPattern, to: COLPAT}
          - copy: {from: condition, to: CONDTN}
          - apply: radarConspicuoustoCONRAD
          - apply: visualProminence_to_CONVIS
          - copy: {from: depthRangeMinimumValue, to: DRVAL1}
          - copy: {from: horizontalClearanceWidth, to: HORCLR}
          - copy: {from: horizontalLength, to: HORLEN}
          - copy: {from: horizontalWidth, to: HORWID}
          - copy: {from: liftingCapacity, to: LIFCAP}
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: status_to_STATUS_INFORM
          - copy: {from: verticalLength, to: VERLEN}
          - apply: maximumPermittedDraught_to_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - message: {text: "Intervention required: FLODOC is a Skin of the Earth feature in S-57. Amend surrounding Depth or Dredged area to cut a hole.", severity: intervention}
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

      - object: CTNARE
        actions:
          - apply: fixeddates_to_INFORM
          # TODO: fixeddates_to_INFORM is a local rule — confirm its exact definition

  - when: {geometry: Area}
    create:
      - object: FLODOC
        actions:
          - copy: {from: colour, to: COLOUR}
          - copy: {from: colourPattern, to: COLPAT}
          - copy: {from: condition, to: CONDTN}
          - apply: radarConspicuoustoCONRAD
          - apply: visualProminence_to_CONVIS
          - copy: {from: depthRangeMinimumValue, to: DRVAL1}
          - copy: {from: horizontalClearanceWidth, to: HORCLR}
          - copy: {from: horizontalLength, to: HORLEN}
          - copy: {from: horizontalWidth, to: HORWID}
          - copy: {from: liftingCapacity, to: LIFCAP}
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: status_to_STATUS_INFORM
          - copy: {from: verticalLength, to: VERLEN}
          - apply: maximumPermittedDraught_to_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - message: {text: "Intervention required: FLODOC is a Skin of the Earth feature in S-57. Amend surrounding Depth or Dredged area to cut a hole.", severity: intervention}
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

  - create:
      - object: FLODOC
        actions:
          - copy: {from: colour, to: COLOUR}
          - copy: {from: colourPattern, to: COLPAT}
          - copy: {from: condition, to: CONDTN}
          - apply: radarConspicuoustoCONRAD
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: visualProminence_to_CONVIS
          - copy: {from: depthRangeMinimumValue, to: DRVAL1}
          - copy: {from: horizontalClearanceWidth, to: HORCLR}
          - copy: {from: horizontalLength, to: HORLEN}
          - copy: {from: horizontalWidth, to: HORWID}
          - copy: {from: liftingCapacity, to: LIFCAP}
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: status_to_STATUS_INFORM
          - copy: {from: verticalLength, to: VERLEN}
          - apply: maximumPermittedDraught_to_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_dated_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_dated_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP
