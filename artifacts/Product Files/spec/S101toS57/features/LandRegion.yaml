feature: LandRegion
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Three cases in order of priority:
  1. categoryOfLandRegion=19 (rock column/pinnacle) → LNDMRK with CATLMK=22.
  2. categoryOfLandRegion=21 (wadi) → LNDRGN with INFORM="Wadi" prepended.
  3. All others → LNDRGN with categoryOfLandRegion_to_CATLND_INFORM lookup.
  natureOfSurface uses append+sep="," (list of comma-separated values) for NATSUR.
  ContactDetails is present for the wadi and default cases.

uses:
  - featureName_to_OBJNAM_NOBJNM
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM

cases:
  - when: {eq: [categoryOfLandRegion, "19"]}
    create:
      - object: LNDMRK
        actions:
          - set: {attr: CATLMK, value: "22"}
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: nauticalInformation_to_INFORM_NINFOM

  - when: {eq: [categoryOfLandRegion, "21"]}
    create:
      - object: LNDRGN
        actions:
          - set: {attr: INFORM, value: "Wadi"}
          - copy: {from: natureOfSurface, to: NATSUR, append: true, sep: ","}
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: waterLevelEffect, to: WATLEV}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM

  - create:
      - object: LNDRGN
        actions:
          - lookup:
              source: categoryOfLandRegion
              target: CATLND
              cases:
                21:
                  actions:
                    - set: {attr: INFORM, value: "Wadi", append: true, sep: "; "}
                    - unknown: CATLND
              default: copy
          - copy: {from: natureOfSurface, to: NATSUR, append: true, sep: ","}
          - apply: featureName_to_OBJNAM_NOBJNM
          - copy: {from: waterLevelEffect, to: WATLEV}
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM
