feature: InstallationBuoy
s65_annex_c: Table 12
notes: >
  TOPMAR is only produced when topmark.topmarkDaymarkShape is populated.

uses:
  - radarConspicuoustoCONRAD
  - natureOfConstruction_to_NATCON_INFORM
  - featureName_to_OBJNAM_NOBJNM
  - product_to_PRODCT_INFORM
  - status_to_STATUS_INFORM
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_PEREND
  - Pad_PERSTA
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM_PICREP

cases:
  - create:
      - object: BOYINB
        actions:
          - copy: {from: buoyShape, to: BOYSHP}
          - copy: {from: categoryOfInstallationBuoy, to: CATINB}
          - copy: {from: colour, to: COLOUR}
          - copy: {from: colourPattern, to: COLPAT}
          - apply: radarConspicuoustoCONRAD
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: natureOfConstruction_to_NATCON_INFORM
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: product_to_PRODCT_INFORM
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

      - object: TOPMAR
        condition: "has topmark.topmarkDaymarkShape"
        actions:
          - copy: {from: 'topmark.colour', to: COLOUR}
          - copy: {from: 'topmark.colourPattern', to: COLPAT}
          - copy: {from: 'topmark.topmarkDaymarkShape', to: TOPSHP}
          - copy: {from: 'topmark.shapeInformation.text', to: INFORM}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
