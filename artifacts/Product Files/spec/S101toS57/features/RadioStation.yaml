feature: RadioStation
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  assign_COMCHA is an XML attribute script — flagged as TODO pending DSL support.
  ContactDetails: communicationChannel → COMCHA, callSign → CALSGN (not INFORM),
  frequencyShoreStationTransmits → SIGFRQ (not INFORM). This differs from most features.
  frequencyPair_to_SIGFRQ is an XML attribute-mapping rule — flagged as TODO.

cases:
  - create:
      - object: RDOSTA
        actions:
          - lookup:
              source: categoryOfRadioStation
              target: CATROS
              cases:
                9:
                  actions:
                    - set: {attr: INFORM, value: "AIS shore station", append: true, sep: "; "}
                10:
                  actions:
                    - set: {attr: INFORM, value: "Coastal radio station", append: true, sep: "; "}
                11:
                  actions:
                    - set: {attr: INFORM, value: "LORAN-C station", append: true, sep: "; "}
                12:
                  actions:
                    - set: {attr: INFORM, value: "DGPS station", append: true, sep: "; "}
              default: copy
              # TODO: assign_COMCHA script — refer to S-65 Annex C for clarification
          - copy: {from: callSign, to: CALSGN}
          - copy: {from: estimatedRangeOfTransmission, to: ESTRNG}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
              # TODO: frequencyPair_to_SIGFRQ — refer to S-65 Annex C for clarification
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - from_related:
              relation: AdditionalInformation/theInformation/ContactDetails
              copy:
                - {from: communicationChannel,           to: COMCHA, append: true, sep: ";"}
                - {from: callSign,                       to: CALSGN, append: true, sep: ";"}
                - {from: frequencyShoreStationTransmits, to: SIGFRQ, append: true, sep: ";"}
                - {from: contactInstructions,            to: INFORM, append: true, sep: ";"}
          - apply: nauticalInformation_to_INFORM_NINFOM
