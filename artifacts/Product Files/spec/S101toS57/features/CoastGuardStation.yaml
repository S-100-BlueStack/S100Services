feature: CoastGuardStation
s65_annex_c: Table 30
notes: >
  Area features are converted to Point geometry before output.
  ServiceHours and NonStandardWorkingDay supply periodicDateRange in addition to fixedDateRange.

uses:
  - featureName_to_OBJNAM_NOBJNM
  - status_to_STATUS_INFORM
  - Pad_DATEND
  - Pad_DATSTA
  - Pad_PEREND
  - Pad_PERSTA
  - information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
  - contactDetails_to_INFORM
  - nauticalInformation_to_INFORM_NINFOM
  - nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
  - serviceHours_all_dates_to_INFORM_NINFOM

cases:
  - when: {geometry: Area}
    create:
      - object: CGUSTA
        actions:
          - convert_geometry: Point
          - cases:
              - when: {eq: [isMRCC, "True"]}
                actions:
                  - set: {attr: INFORM, value: "Maritime Rescue and Coordination Centre",
                          append: true, sep: "; "}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_all_dates_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM

  - create:
      - object: CGUSTA
        actions:
          - apply: MRCCasCGUSTA
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum, to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - apply: contactDetails_to_INFORM
          - apply: serviceHours_all_dates_to_INFORM_NINFOM
          - apply: nonStandardWorkingDay_all_dates_to_INFORM_NINFOM
          - apply: nauticalInformation_to_INFORM_NINFOM
