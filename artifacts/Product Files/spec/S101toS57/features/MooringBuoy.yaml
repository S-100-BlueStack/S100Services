feature: MooringBuoy
s65_annex_c: Table XX
# TODO: confirm S-65 Annex C table number
notes: >
  Always produces MORFAC with CATMOR=7.
  Also produces SMCFAC with CATSCF=29 when visitorsMooring=True — both objects are created
  together (SMCFAC is a secondary conditional output, not a separate case).
  No topmark, no marksNavigationalSystemOf, no radarConspicuous, no natureOfConstruction.

cases:
  - create:
      - object: MORFAC
        actions:
          - set:  {attr: CATMOR, value: "7"}
          - apply: maximumPermittedDraught_to_INFORM
          - apply: maximumPermittedVesselLength_to_INFORM
          - copy: {from: buoyShape,       to: BOYSHP}
          - copy: {from: colour,          to: COLOUR}
          - copy: {from: colourPattern,   to: COLPAT}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum,    to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP

      - object: SMCFAC
        condition: "visitorsMooring == 'True'"
        actions:
          - set:  {attr: CATSCF, value: "29"}
          - apply: maximumPermittedDraught_to_INFORM
          - apply: maximumPermittedVesselLength_to_INFORM
          - copy: {from: colour,          to: COLOUR}
          - copy: {from: colourPattern,   to: COLPAT}
          - apply: Pad_DATEND
          - apply: Pad_DATSTA
          - apply: featureName_to_OBJNAM_NOBJNM
          - apply: Pad_PEREND
          - apply: Pad_PERSTA
          - apply: status_to_STATUS_INFORM
          - copy: {from: scaleMinimum,    to: SCAMIN}
          - apply: information_and_fileReference_to_INFORM_NINFOM_TXTDSC_NTXTDS
          - copy: {from: pictorialRepresentation, to: PICREP, append: true, sep: ";"}
          - apply: contactDetails_to_INFORM
          - apply: nauticalInformation_to_INFORM_NINFOM_PICREP
