rule: trafficSeparationScheme_to_CATTSS_INFORM
actions:
  - from_related:
      relation: TrafficSeparationSchemeAggregation/theCollection/TrafficSeparationScheme
      copy:
        - {from: iMOAdopted,              to: CATTSS}
        - {from: maximumPermittedDraught, to: INFORM, append: true, sep: "; "}
