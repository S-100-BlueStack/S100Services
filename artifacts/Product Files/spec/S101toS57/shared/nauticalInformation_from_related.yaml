rule: nauticalInformation_to_INFORM_NINFOM
actions:
  - from_related:
      relation: AdditionalInformation/theInformation/NauticalInformation
      copy:
        - {from: 'information[0].text',          to: INFORM,  append: true, sep: ";"}
        - {from: 'information[1].text',          to: NINFOM,  append: true, sep: ";"}
        - {from: 'information[0].fileReference', to: TXTDSC,  append: true, sep: ";"}
        - {from: 'information[1].fileReference', to: NTXTDS,  append: true, sep: ";"}
---

rule: contactDetails_to_INFORM
actions:
