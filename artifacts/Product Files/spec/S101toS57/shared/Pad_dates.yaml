# Date-padding shared rules.
#
# S-101 stores dates in ISO 8601 partial format:
#   YYYYMMDD  (full date — 8 digits)
#   YYYYMM--  (year+month — 6 digits + --)
#   YYYY----  (year only  — 4 digits + ----)
#
# S-57 stores only the numeric portion (strips the trailing dashes).
# These rules strip the dashes and copy the result.
# A fallback case emits a warning when the format is unrecognised.
---
rule: Pad_DATSTA
description: Maps S-101 fixedDateRange.dateStart to S-57 DATSTA, stripping ISO date padding.

cases:
  - when: {matches_cs: ['fixedDateRange.dateStart', '^\\d{6}--$']}
    actions:
      - replace: {from: 'fixedDateRange.dateStart', to: DATSTA,
                  pattern: '(\\d{6})(--)', capture: '$1'}

  - when: {matches_cs: ['fixedDateRange.dateStart', '^\\d{4}----$']}
    actions:
      - replace: {from: 'fixedDateRange.dateStart', to: DATSTA,
                  pattern: '(\\d{4})(----)', capture: '$1'}

  - when:
      or:
        - {matches_cs: ['fixedDateRange.dateStart', '^\\d{8}$']}
        - {unknown: 'fixedDateRange.dateStart'}
    actions:
      - copy: {from: 'fixedDateRange.dateStart', to: DATSTA}

  - when:
      not: {undefined: 'fixedDateRange.dateStart'}
    actions:
      - copy: {from: 'fixedDateRange.dateStart', to: DATSTA}
      - warn: "S-101 fixedDateRange.dateStart copied to DATSTA; format may be incorrect."
